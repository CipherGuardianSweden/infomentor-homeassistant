name: 🐛 Buggrapport
description: Något fungerar inte som det ska
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Tack för att du testar! 🙏 Fyll i så mycket du kan — det gör att vi kan fixa snabbare.

        **Så hittar du det vi behöver:**
        - **Loggar:** Inställningar → System → Loggar → filtrera på `infomentor`
        - **Diagnostik:** Inställningar → Enheter & tjänster → **InfoMentor** → ⋮ → *Hämta diagnostik*
          (känsliga uppgifter är redan maskerade) — dra in filen här.

  - type: input
    id: version
    attributes:
      label: Version av integrationen
      placeholder: "t.ex. 0.1.3 (HACS → InfoMentor)"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant-version
      placeholder: "t.ex. 2026.9.4"
    validations:
      required: true

  - type: input
    id: municipality
    attributes:
      label: Kommun/skola
      description: Hjälper oss se om vissa kommuner skiljer sig åt.
      placeholder: "t.ex. Vänersborg (Silvertärnan)"
    validations:
      required: false

  - type: textarea
    id: what_happened
    attributes:
      label: Vad hände?
      description: Beskriv vad du gjorde och vad som hände.
      placeholder: "Jag lade till integrationen, den hittade 1 barn, men sedan ..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Vad förväntade du dig?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Loggutdrag
      description: Klistra in rader som innehåller `infomentor`.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Innan du skickar
      options:
        - label: Jag har uppdaterat till senaste versionen via HACS
        - label: Jag kan logga in på infomentor.se i webbläsaren (samma konto)
